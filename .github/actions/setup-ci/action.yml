name: Set up Station CI

description: Install the pinned runtimes, workspace dependencies, and optional Station dependencies.

inputs:
  station-dependencies:
    description: Install the Station renderer's Bun dependencies.
    required: false
    default: "false"
  restore-turbo-cache:
    description: Restore and save the pull request Turbo cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - name: Restore Turbo cache
      if: inputs.restore-turbo-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ hashFiles('bun.lock', 'bunfig.toml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ hashFiles('bun.lock', 'bunfig.toml', 'turbo.json') }}-
    - name: Install Bun workspace
      shell: bash
      env:
        STATION_DEPENDENCIES: ${{ inputs.station-dependencies }}
      run: |
        if [[ "$STATION_DEPENDENCIES" == true ]]; then
          bun install --frozen-lockfile
        else
          bun install --frozen-lockfile --filter '!@station/workspace'
        fi
