name: promote-release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release workflow run containing the accepted candidate artifact
        required: true
        type: string
      tag:
        description: Draft release tag to verify and publish
        required: true
        type: string
      manual_acceptance:
        description: Confirm macOS partial crossover preserved old Host output and the target native UI visibly refused it
        required: true
        type: boolean

permissions: {}

concurrency:
  group: station-release-publication
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.manual_acceptance
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      target_build_identity: ${{ steps.candidate.outputs.target_build_identity }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
    steps:
      - name: Verify accepted candidate and publish its draft
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          node -e '
            const tag = process.argv[1];
            const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
            if (!semver.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
          ' "$TAG"
          version="${TAG#v}"

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = release
          test "$(jq -r .event <<<"$run_json")" = push
          test "$(jq -r .conclusion <<<"$run_json")" = success
          workflow_id="$(jq -er .workflow_id <<<"$run_json")"
          [[ "$workflow_id" =~ ^[0-9]+$ ]]
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq .path
          )" = .github/workflows/release.yml
          run_attempt="$(jq -r .run_attempt <<<"$run_json")"
          [[ "$run_attempt" =~ ^[0-9]+$ ]]

          artifact="accepted-release-candidate-$version-attempt-$run_attempt"
          mkdir candidate
          gh run download "$RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir candidate

          commit="$(jq -er .commit candidate/manifest.json)"
          previous_tag="$(jq -er .previousTag candidate/manifest.json)"
          release_id="$(jq -er .releaseId candidate/manifest.json)"
          target_build_identity="$(jq -er .targetBuildIdentity candidate/manifest.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_id" =~ ^[0-9]+$ ]]
          [[ "$target_build_identity" =~ ^[0-9a-f]{64}$ ]]
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$TAG" \
            --arg commit "$commit" \
            --arg previousTag "$previous_tag" \
            --arg targetBuildIdentity "$target_build_identity" \
            --argjson workflowRunId "$RELEASE_RUN_ID" \
            --argjson workflowRunAttempt "$run_attempt" \
            --argjson releaseId "$release_id" \
            '.repository == $repository and
             .tag == $tag and
             .previousTag == $previousTag and
             .commit == $commit and
             .workflowRunId == $workflowRunId and
             .workflowRunAttempt == $workflowRunAttempt and
             .releaseId == $releaseId and
             (.checksumFileSha256 | test("^[0-9a-f]{64}$")) and
             .targetBuildIdentity == $targetBuildIdentity' \
            candidate/manifest.json >/dev/null
          test "$(jq -r .head_sha <<<"$run_json")" = "$commit"
          comparison_status="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status
          )"
          case "$comparison_status" in
            ahead|identical) ;;
            *) echo "Release commit $commit is no longer on main." >&2; exit 1 ;;
          esac
          test "$(sha256sum candidate/SHA256SUMS | awk '{print $1}')" = \
            "$(jq -r .checksumFileSha256 candidate/manifest.json)"

          node -e '
            const tag = process.argv[1];
            const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
            if (!semver.test(tag)) throw new Error(`Invalid previous release tag: ${tag}`);
          ' "$previous_tag"
          previous_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous_tag")"
          test "$(jq -r .draft <<<"$previous_json")" = false
          test "$(jq -r .immutable <<<"$previous_json")" = true
          test "$(jq -r .tag_name <<<"$previous_json")" = "$previous_tag"
          previous_version="${previous_tag#v}"
          expected_previous=(
            SHA256SUMS
            install.sh
            "stn-v$previous_version-darwin-arm64.tar.gz"
            "stn-v$previous_version-darwin-x64.tar.gz"
            "stn-v$previous_version-linux-arm64.tar.gz"
            "stn-v$previous_version-linux-x64.tar.gz"
          )
          mapfile -t previous_assets < <(jq -r '.assets[].name' <<<"$previous_json" | sort)
          mapfile -t wanted_previous < <(printf '%s\n' "${expected_previous[@]}" | sort)
          test "${previous_assets[*]}" = "${wanted_previous[*]}"

          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$remote_commit" = "$commit"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          test "$(jq -r .draft <<<"$release_json")" = true
          test "$(jq -r .tag_name <<<"$release_json")" = "$TAG"
          expected_prerelease=false
          case "$version" in *-*) expected_prerelease=true ;; esac
          test "$(jq -r .prerelease <<<"$release_json")" = "$expected_prerelease"

          expected=(
            SHA256SUMS
            install.sh
            "stn-v$version-darwin-arm64.tar.gz"
            "stn-v$version-darwin-x64.tar.gz"
            "stn-v$version-linux-arm64.tar.gz"
            "stn-v$version-linux-x64.tar.gz"
          )
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${wanted[*]}"

          current_ids="$(
            jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' <<<"$release_json"
          )"
          test "$current_ids" = "$(cat candidate/asset-ids.txt)"
          mkdir downloaded
          for name in "${expected[@]}"; do
            asset_id="$(awk -F= -v name="$name" '$1 == name { print $2 }' candidate/asset-ids.txt)"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "downloaded/$name"
          done
          cmp candidate/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum -c SHA256SUMS)

          final_release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          final_ids="$(
            jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' <<<"$final_release_json"
          )"
          test "$(jq -r .draft <<<"$final_release_json")" = true
          test "$(jq -r .prerelease <<<"$final_release_json")" = "$expected_prerelease"
          test "$final_ids" = "$current_ids"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$commit"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "target_build_identity=$target_build_identity" >> "$GITHUB_OUTPUT"

          freshest_previous="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              node -e '
                const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
                const tagPattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
                const complete = pages.flat().filter((release) => {
                  if (release.draft || release.immutable !== true || release.tag_name === process.argv[1]) return false;
                  if (!tagPattern.test(release.tag_name) || !Number.isSafeInteger(release.id) || release.id <= 0) return false;
                  if (typeof release.published_at !== "string" || !Number.isFinite(Date.parse(release.published_at))) return false;
                  const version = release.tag_name.slice(1);
                  const expected = [
                    "SHA256SUMS",
                    "install.sh",
                    ...["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64"].map(
                      (target) => `stn-v${version}-${target}.tar.gz`,
                    ),
                  ].sort();
                  const actual = release.assets?.map((asset) => asset.name).sort() ?? [];
                  const assetIds = release.assets?.map((asset) => asset.id) ?? [];
                  return new Set(actual).size === actual.length &&
                    assetIds.every((id) => Number.isSafeInteger(id) && id > 0) &&
                    new Set(assetIds).size === assetIds.length &&
                    actual.length === expected.length &&
                    actual.every((name, index) => name === expected[index]);
                });
                complete.sort((left, right) =>
                  Date.parse(right.published_at) - Date.parse(left.published_at) || right.id - left.id,
                );
                if (complete[0] === undefined) throw new Error("No complete immutable published Station predecessor exists.");
                process.stdout.write(complete[0].tag_name);
              ' "$TAG"
          )"
          test "$freshest_previous" = "$previous_tag"

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F tag_name="$TAG" \
            -F prerelease="$expected_prerelease" \
            -F draft=false >/dev/null
          published_release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          test "$(jq -r .draft <<<"$published_release_json")" = false
          test "$(jq -r .tag_name <<<"$published_release_json")" = "$TAG"
          test "$(jq -r .prerelease <<<"$published_release_json")" = "$expected_prerelease"
          test "$(
            jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' <<<"$published_release_json"
          )" = "$current_ids"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$commit"

  verify-public-install:
    name: verify public install (${{ matrix.target }})
    needs: promote
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - if: runner.os == 'macOS'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-ci
      - name: Build public update harness
        if: runner.os == 'macOS'
        run: |
          command -v tmux >/dev/null 2>&1 || brew install tmux
          bun run build
      - name: Install exact public predecessor
        if: runner.os == 'macOS'
        env:
          PREVIOUS_TAG: ${{ needs.promote.outputs.previous_tag }}
        run: |
          predecessor_installer="$RUNNER_TEMP/previous-install.sh"
          env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
            curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$predecessor_installer" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS_TAG/install.sh"
          grep -Fx "embedded_version=\"$PREVIOUS_TAG\"" "$predecessor_installer"
          previous_home="$RUNNER_TEMP/update-incumbent-home"
          previous_bin="$RUNNER_TEMP/update-incumbent/bin"
          mkdir -p "$previous_home"
          HOME="$previous_home" \
            XDG_DATA_HOME="$previous_home/.local/share" \
            /bin/sh "$predecessor_installer" --install-dir "$previous_bin"
          test "$("$previous_bin/stn" --version)" = "${PREVIOUS_TAG#v}"
      - name: Download exact-tag public installer
        env:
          TAG: ${{ inputs.tag }}
        run: |
          installer="$RUNNER_TEMP/station-install.sh"
          env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
            curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$installer" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh"
          test -s "$installer"
          /bin/sh -n "$installer"
          grep -Fx "embedded_version=\"$TAG\"" "$installer"
          chmod 0700 "$installer"
      - name: Install without GitHub credentials or gh
        env:
          EXPECTED_VERSION: ${{ inputs.tag }}
        run: |
          public_path="$RUNNER_TEMP/public-path"
          mkdir -p "$public_path"
          for command in awk cat chmod cp curl grep gzip ln ls mkdir mktemp mv paste readlink rm rmdir sleep sort stat tar tr uname; do
            command_path="$(command -v "$command")"
            test -n "$command_path"
            ln -s "$command_path" "$public_path/$command"
          done
          if command -v sha256sum >/dev/null 2>&1; then
            ln -s "$(command -v sha256sum)" "$public_path/sha256sum"
          else
            ln -s "$(command -v shasum)" "$public_path/shasum"
          fi
          test ! -e "$public_path/gh"

          install_home="$RUNNER_TEMP/public-install-home"
          bin_dir="$install_home/.local/bin"
          data_home="$install_home/.local/share"
          mkdir -p "$install_home"
          env -i \
            HOME="$install_home" \
            XDG_DATA_HOME="$data_home" \
            PATH="$public_path" \
            /bin/sh "$RUNNER_TEMP/station-install.sh" --install-dir "$bin_dir"

          version="${EXPECTED_VERSION#v}"
          test "$(env -i HOME="$install_home" XDG_DATA_HOME="$data_home" \
            PATH="$bin_dir:$public_path" stn --version)" = "$version"
          test "$(readlink "$bin_dir/stn-ingress")" = stn
          test "$(readlink "$bin_dir/stn-tmux-popup")" = stn
          receipt_path="$bin_dir/.station-install-receipt"
          test -f "$receipt_path"
          test ! -L "$receipt_path"
          test "$(cat "$receipt_path")" = station-installer-binary-v1
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(stat -c '%a' "$receipt_path")" = 600
          else
            test "$(stat -f '%Lp' "$receipt_path")" = 600
          fi
          test -f "$data_home/station/LICENSE"
      - name: Verify public update discovery and download
        if: runner.os == 'macOS'
        env:
          PREVIOUS_TAG: ${{ needs.promote.outputs.previous_tag }}
          TAG: ${{ inputs.tag }}
          TARGET_BUILD_IDENTITY: ${{ needs.promote.outputs.target_build_identity }}
        run: |
          bun run smoke:update -- \
            --incumbent-binary "$RUNNER_TEMP/update-incumbent/bin/stn" \
            --incumbent-version "${PREVIOUS_TAG#v}" \
            --public-target-tag "$TAG" \
            --target-build-identity "$TARGET_BUILD_IDENTITY" \
            --scenarios no-host
