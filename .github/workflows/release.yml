name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="$GITHUB_REF_NAME"

          node -e '
            const version = process.argv[1];
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
            if (!semver.test(version)) {
              throw new Error(`Release version must be SemVer without build metadata: ${version}`);
            }
          ' "$version"

          if [[ "$tag" != "v$version" ]]; then
            echo "Release tag $tag must exactly match package.json version v$version." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $tag resolves to $tag_commit, not workflow commit $GITHUB_SHA." >&2
            exit 1
          fi

          comparison_status="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status
          )"
          case "$comparison_status" in
            ahead|identical) ;;
            *) echo "Release commit $GITHUB_SHA is not on main." >&2; exit 1 ;;
          esac

          previous_tag="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              node -e '
                const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
                const tagPattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
                const complete = pages.flat().filter((release) => {
                  if (release.draft || release.immutable !== true || release.tag_name === process.argv[1]) return false;
                  if (!tagPattern.test(release.tag_name) || !Number.isSafeInteger(release.id) || release.id <= 0) return false;
                  if (typeof release.published_at !== "string" || !Number.isFinite(Date.parse(release.published_at))) return false;
                  const version = release.tag_name.slice(1);
                  const expected = [
                    "SHA256SUMS",
                    "install.sh",
                    ...["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64"].map(
                      (target) => `stn-v${version}-${target}.tar.gz`,
                    ),
                  ].sort();
                  const actual = release.assets?.map((asset) => asset.name).sort() ?? [];
                  const assetIds = release.assets?.map((asset) => asset.id) ?? [];
                  return new Set(actual).size === actual.length &&
                    assetIds.every((id) => Number.isSafeInteger(id) && id > 0) &&
                    new Set(assetIds).size === assetIds.length &&
                    actual.length === expected.length &&
                    actual.every((name, index) => name === expected[index]);
                });
                complete.sort((left, right) =>
                  Date.parse(right.published_at) - Date.parse(left.published_at) || right.id - left.id,
                );
                if (complete[0] === undefined) throw new Error("No complete immutable published Station predecessor exists.");
                process.stdout.write(complete[0].tag_name);
              ' "$tag"
          )"

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  standard-ci:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/standard-ci.yml

  release-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release smoke
        run: pnpm smoke:release

  # Checked 2026-07-11: these hosted labels cover the four supported native targets.
  build-native:
    name: build (${{ matrix.target }})
    needs:
      - validate
      - standard-ci
      - release-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Install (bun)
        run: bun install --frozen-lockfile
        working-directory: station
      - name: Build compiled binary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: pnpm build:binary -- --version "$VERSION"
      - name: Test compiled binary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: pnpm smoke:binary -- --expected-version "$VERSION"
      - name: Package release archive
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bin_dir="station/dist/bin"
          scripts/release/package-archive.sh "$VERSION" "$TARGET"

          if [[ "$RUNNER_OS" == Linux ]]; then
            floor="$(getconf GNU_LIBC_VERSION)"
          else
            minos="$(otool -l "$bin_dir/stn" | awk '/cmd LC_BUILD_VERSION/{found=1; next} found && $1 == "minos" {print $2; exit}')"
            test -n "$minos"
            floor="macOS $minos"
          fi

          {
            echo "target=$TARGET"
            echo "runner=$RUNNER_LABEL"
            echo "floor=$floor"
            echo "buildIdentity=$(cat packages/runtime/dist/station-build-id)"
          } > "platform-metadata-$TARGET.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            stn-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            platform-metadata-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 3

  create-draft:
    needs:
      - validate
      - standard-ci
      - release-smoke
      - build-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Stamp release installer
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$(grep -Fxc 'embedded_version=""' scripts/install.sh)" = 1
          sed "s/^embedded_version=\"\"$/embedded_version=\"$TAG\"/" \
            scripts/install.sh > release/install.sh
          chmod 0755 release/install.sh
          /bin/sh -n release/install.sh
          grep -Fx "embedded_version=\"$TAG\"" release/install.sh
      - name: Verify assets and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: release
        run: |
          expected=(
            "stn-v$VERSION-darwin-arm64.tar.gz"
            "stn-v$VERSION-darwin-x64.tar.gz"
            "stn-v$VERSION-linux-arm64.tar.gz"
            "stn-v$VERSION-linux-x64.tar.gz"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -name 'stn-v*.tar.gz' -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Expected archives: %s\n' "${expected[*]}" >&2
            printf 'Actual archives: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          test -x install.sh

          : > SHA256SUMS
          for asset in "${expected[@]}" install.sh; do
            sha256sum "$asset" >> SHA256SUMS
          done

          mapfile -t metadata < <(find . -maxdepth 1 -type f -name 'platform-metadata-*.txt' -printf '%f\n' | sort)
          if [[ "${#metadata[@]}" -ne 4 ]]; then
            echo "Expected four platform metadata records; found ${#metadata[@]}." >&2
            exit 1
          fi
          mapfile -t build_identities < <(sed -n 's/^buildIdentity=//p' "${metadata[@]}" | sort -u)
          if [[ "${#build_identities[@]}" -ne 1 || ! "${build_identities[0]}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Native builds did not report one common 64-hex build identity." >&2
            exit 1
          fi
          printf '%s\n' "${build_identities[0]}" > target-build-identity.txt
      - name: Write release notes
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        working-directory: release
        run: |
          {
            echo "Station $TAG native binaries."
            printf 'Build commit: `%s`.\n' "$GITHUB_SHA"
            echo
            echo "Install from the exact tagged public installer asset."
            echo
            echo "## Native platform floors"
            echo
            echo '```text'
            for metadata in platform-metadata-*.txt; do
              cat "$metadata"
              echo
            done
            echo '```'
            echo
            echo "The x64 builds use Bun's baseline CPU targets. Linux artifacts require glibc."
          } > release-notes.md
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: release
        run: |
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          if [[ "$remote_commit" != "$COMMIT" ]]; then
            echo "Release tag $TAG moved from validated commit $COMMIT to $remote_commit." >&2
            exit 1
          fi

          assets=(
            "stn-v$VERSION-darwin-arm64.tar.gz"
            "stn-v$VERSION-darwin-x64.tar.gz"
            "stn-v$VERSION-linux-arm64.tar.gz"
            "stn-v$VERSION-linux-x64.tar.gz"
            install.sh
            SHA256SUMS
          )
          args=(
            "$TAG"
            "${assets[@]}"
            --draft
            --generate-notes
            --notes-file release-notes.md
            --title "Station $TAG"
            --verify-tag
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          # Installer acceptance runs against this draft before a human may publish it.
          gh release create "${args[@]}"

          # Draft visibility can lag creation; gh release view uses GitHub's draft-aware tag lookup.
          release_id=""
          for _ in {1..12}; do
            release_id="$(
              gh release view "$TAG" --json databaseId,isDraft \
                --jq 'select(.isDraft == true) | .databaseId' 2>/dev/null || true
            )"
            [[ "$release_id" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Expected the draft release for $TAG to become readable." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          mkdir candidate
          cp SHA256SUMS candidate/SHA256SUMS
          target_build_identity="$(cat target-build-identity.txt)"
          [[ "$target_build_identity" =~ ^[0-9a-f]{64}$ ]]
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          test "$(jq -r .draft <<<"$release_json")" = true
          expected_names="$(printf '%s\n' "${assets[@]}" | sort)"
          actual_names="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          test "$actual_names" = "$expected_names"
          jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' \
            <<<"$release_json" > candidate/asset-ids.txt
          test "$(wc -l < candidate/asset-ids.txt | tr -d ' ')" = 6
          test "$(cut -d= -f2 candidate/asset-ids.txt | grep -Ec '^[1-9][0-9]*$')" = 6
          test "$(cut -d= -f2 candidate/asset-ids.txt | sort -u | wc -l | tr -d ' ')" = 6
          checksum_file_sha="$(sha256sum SHA256SUMS | awk '{print $1}')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg previousTag "$PREVIOUS_TAG" \
            --arg checksumFileSha256 "$checksum_file_sha" \
            --arg targetBuildIdentity "$target_build_identity" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson releaseId "$release_id" \
            '{
              repository: $repository,
              workflowRunId: $workflowRunId,
              workflowRunAttempt: $workflowRunAttempt,
              commit: $commit,
              tag: $tag,
              previousTag: $previousTag,
              releaseId: $releaseId,
              checksumFileSha256: $checksumFileSha256,
              targetBuildIdentity: $targetBuildIdentity
            }' > candidate/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-input-${{ needs.validate.outputs.version }}-attempt-${{ github.run_attempt }}
          path: release/candidate
          if-no-files-found: error
          retention-days: 3

  install-draft:
    name: install draft (${{ matrix.target }})
    needs:
      - validate
      - create-draft
    permissions:
      # GitHub exposes draft releases only to identities with push access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-input-${{ needs.validate.outputs.version }}-attempt-${{ github.run_attempt }}
          path: candidate
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-ci
      - name: Build composed update harness
        if: runner.os == 'macOS'
        run: |
          command -v tmux >/dev/null 2>&1 || brew install tmux
          pnpm build
      - name: Fetch tagged installer
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs['create-draft'].outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r .draft <<<"$release_json")" = true
          test "$(jq -r .tag_name <<<"$release_json")" = "$TAG"
          current_ids="$(jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' <<<"$release_json")"
          test "$current_ids" = "$(cat candidate/asset-ids.txt)"
          installer_asset_id="$(awk -F= '$1 == "install.sh" { print $2 }' candidate/asset-ids.txt)"
          [[ "$installer_asset_id" =~ ^[0-9]+$ ]]
          installer="$RUNNER_TEMP/station-install.sh"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$installer_asset_id" > "$installer"
          test -s "$installer"
          /bin/sh -n "$installer"
          grep -Fx "embedded_version=\"$TAG\"" "$installer"
          chmod 0700 "$installer"
      - name: Fetch staged update assets and exact predecessor
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          RELEASE_ID: ${{ needs['create-draft'].outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          target_version="${TAG#v}"
          release_dir="$RUNNER_TEMP/update-release"
          mkdir -p "$release_dir"
          for name in install.sh SHA256SUMS "stn-v$target_version-$TARGET.tar.gz"; do
            asset_id="$(awk -F= -v name="$name" '$1 == name { print $2 }' candidate/asset-ids.txt)"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$release_dir/$name"
            test -s "$release_dir/$name"
          done
          grep -Fx "embedded_version=\"$TAG\"" "$release_dir/install.sh"
          cmp candidate/SHA256SUMS "$release_dir/SHA256SUMS"
          (
            cd "$release_dir"
            grep -E "  (install\\.sh|stn-v$target_version-$TARGET\\.tar\\.gz)$" SHA256SUMS |
              sha256sum -c -
          )

          predecessor_installer="$RUNNER_TEMP/previous-install.sh"
          env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
            curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$predecessor_installer" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$PREVIOUS_TAG/install.sh"
          grep -Fx "embedded_version=\"$PREVIOUS_TAG\"" "$predecessor_installer"
          previous_home="$RUNNER_TEMP/update-incumbent-home"
          previous_bin="$RUNNER_TEMP/update-incumbent/bin"
          mkdir -p "$previous_home"
          HOME="$previous_home" \
            XDG_DATA_HOME="$previous_home/.local/share" \
            /bin/sh "$predecessor_installer" --install-dir "$previous_bin"
          test "$("$previous_bin/stn" --version)" = "${PREVIOUS_TAG#v}"
      - name: Seed existing installation
        run: |
          install_home="$RUNNER_TEMP/install-home"
          bin_dir="$install_home/.local/bin"
          data_home="$install_home/.local/share"
          license_dir="$data_home/station"
          mkdir -p "$bin_dir" "$license_dir"

          cat > "$bin_dir/stn" <<'EOF'
          #!/bin/sh
          printf '%s\n' 0.7.1-rc.8
          EOF
          chmod 0755 "$bin_dir/stn"
          ln -s stn "$bin_dir/stn-ingress"
          ln -s stn "$bin_dir/stn-tmux-popup"
          printf '%s\n' 'old Station license fixture' > "$license_dir/LICENSE"
          chmod 0644 "$license_dir/LICENSE"
          cp "$bin_dir/stn" "$RUNNER_TEMP/old-stn-fixture"

          test "$("$bin_dir/stn" --version)" = 0.7.1-rc.8
          test "$(readlink "$bin_dir/stn-ingress")" = stn
          test "$(readlink "$bin_dir/stn-tmux-popup")" = stn
      - name: Install from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          STATION_INSTALL_RELEASE_ID: ${{ needs['create-draft'].outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          install_home="$RUNNER_TEMP/install-home"
          bin_dir="$install_home/.local/bin"
          data_home="$install_home/.local/share"
          umask 0777
          HOME="$install_home" \
            XDG_DATA_HOME="$data_home" \
            /bin/sh "$RUNNER_TEMP/station-install.sh" --install-dir "$bin_dir"
      - name: Verify installed artifact
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          install_home="$RUNNER_TEMP/install-home"
          bin_dir="$install_home/.local/bin"
          data_home="$install_home/.local/share"
          license_path="$data_home/station/LICENSE"
          receipt_path="$bin_dir/.station-install-receipt"
          runtime_path="$RUNNER_TEMP/runtime-path"
          mkdir -p "$runtime_path"

          mode() {
            if [[ "$RUNNER_OS" == Linux ]]; then
              stat -c '%a' "$1"
            else
              stat -f '%Lp' "$1"
            fi
          }

          test -x "$bin_dir/stn"
          test "$(readlink "$bin_dir/stn-ingress")" = stn
          test "$(readlink "$bin_dir/stn-tmux-popup")" = stn
          test -f "$receipt_path"
          test ! -L "$receipt_path"
          test -f "$license_path"
          test ! -L "$license_path"
          test "$(mode "$bin_dir/stn")" = 755
          test "$(mode "$receipt_path")" = 600
          test "$(mode "$license_path")" = 644
          test "$(cat "$receipt_path")" = station-installer-binary-v1
          ! cmp -s "$RUNNER_TEMP/old-stn-fixture" "$bin_dir/stn"
          cmp -s LICENSE "$license_path"

          actual="$(env -i \
            HOME="$install_home" \
            XDG_DATA_HOME="$data_home" \
            PATH="$bin_dir:$runtime_path" \
            stn --version)"
          test "$actual" = "$EXPECTED_VERSION"
      - name: Prove composed update from the exact predecessor
        if: runner.os == 'macOS'
        env:
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          target_build_identity="$(jq -er .targetBuildIdentity candidate/manifest.json)"
          pnpm smoke:update -- \
            --incumbent-binary "$RUNNER_TEMP/update-incumbent/bin/stn" \
            --incumbent-version "${PREVIOUS_TAG#v}" \
            --target-release-dir "$RUNNER_TEMP/update-release" \
            --target-tag "$TAG" \
            --target-build-identity "$target_build_identity" \
            --scenarios full \
            --busy-host-outcome preserved-refusal
      - name: Verify lock refusal and same-version retry
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          STATION_INSTALL_RELEASE_ID: ${{ needs['create-draft'].outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          install_home="$RUNNER_TEMP/install-home"
          bin_dir="$install_home/.local/bin"
          data_home="$install_home/.local/share"
          license_path="$data_home/station/LICENSE"
          receipt_path="$bin_dir/.station-install-receipt"
          lock_dir="$bin_dir/.station-install.lock"
          lock_stderr="$RUNNER_TEMP/locked-install.stderr"

          mkdir "$lock_dir"
          chmod 0700 "$lock_dir"
          (
            umask 077
            {
              printf 'pid=%s\n' "$$"
              printf 'requested=%s\n' "$TAG"
            } > "$lock_dir/owner"
          )

          before_binary="$(cksum < "$bin_dir/stn")"
          before_license="$(cksum < "$license_path")"
          before_entries="$(ls -ldi "$bin_dir/stn" "$bin_dir/stn-ingress" "$bin_dir/stn-tmux-popup" "$receipt_path" "$license_path")"
          if (
            umask 0777
            HOME="$install_home" \
              XDG_DATA_HOME="$data_home" \
              /bin/sh "$RUNNER_TEMP/station-install.sh" --install-dir "$bin_dir"
          ) > "$RUNNER_TEMP/locked-install.stdout" 2> "$lock_stderr"; then
            echo "Installer unexpectedly succeeded while $lock_dir was owned." >&2
            exit 1
          fi

          grep -F "$lock_dir" "$lock_stderr"
          grep -F "$$" "$lock_stderr"
          grep -Eiq 'existing Station( installation)? was unchanged' "$lock_stderr"
          grep -Eiq 'wait' "$lock_stderr"
          test -d "$lock_dir"
          test "$(cksum < "$bin_dir/stn")" = "$before_binary"
          test "$(cksum < "$license_path")" = "$before_license"
          test "$(ls -ldi "$bin_dir/stn" "$bin_dir/stn-ingress" "$bin_dir/stn-tmux-popup" "$receipt_path" "$license_path")" = "$before_entries"
          test "$(readlink "$bin_dir/stn-ingress")" = stn
          test "$(readlink "$bin_dir/stn-tmux-popup")" = stn

          rm -rf "$lock_dir"
          before_owned_entries="$(ls -ldi "$bin_dir/stn-ingress" "$bin_dir/stn-tmux-popup" "$receipt_path")"
          (
            umask 0777
            HOME="$install_home" \
              XDG_DATA_HOME="$data_home" \
              /bin/sh "$RUNNER_TEMP/station-install.sh" --install-dir "$bin_dir"
          )

          test ! -e "$lock_dir"
          test "$(ls -ldi "$bin_dir/stn-ingress" "$bin_dir/stn-tmux-popup" "$receipt_path")" = "$before_owned_entries"
          test "$(readlink "$bin_dir/stn-ingress")" = stn
          test "$(readlink "$bin_dir/stn-tmux-popup")" = stn
          test "$(cat "$receipt_path")" = station-installer-binary-v1
          actual="$(env -i \
            HOME="$install_home" \
            XDG_DATA_HOME="$data_home" \
            PATH="$bin_dir:$RUNNER_TEMP/runtime-path" \
            stn --version)"
          test "$actual" = "$EXPECTED_VERSION"

  record-accepted-candidate:
    needs:
      - validate
      - create-draft
      - install-draft
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      # GitHub exposes draft releases only to identities with push access.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-input-${{ needs.validate.outputs.version }}-attempt-${{ github.run_attempt }}
          path: candidate
      - name: Bind accepted draft assets to the workflow run
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          RELEASE_ID: ${{ needs['create-draft'].outputs.release_id }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected=(
            SHA256SUMS
            install.sh
            "stn-v$VERSION-darwin-arm64.tar.gz"
            "stn-v$VERSION-darwin-x64.tar.gz"
            "stn-v$VERSION-linux-arm64.tar.gz"
            "stn-v$VERSION-linux-x64.tar.gz"
          )

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg previousTag "$PREVIOUS_TAG" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson releaseId "$RELEASE_ID" \
            '.repository == $repository and
             .tag == $tag and
             .previousTag == $previousTag and
             .commit == $commit and
             .workflowRunId == $workflowRunId and
             .workflowRunAttempt == $workflowRunAttempt and
             .releaseId == $releaseId and
             (.checksumFileSha256 | test("^[0-9a-f]{64}$")) and
             (.targetBuildIdentity | test("^[0-9a-f]{64}$"))' \
            candidate/manifest.json >/dev/null
          test "$(sha256sum candidate/SHA256SUMS | awk '{print $1}')" = \
            "$(jq -r .checksumFileSha256 candidate/manifest.json)"

          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          previous_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIOUS_TAG")"
          test "$(jq -r .draft <<<"$previous_json")" = false
          test "$(jq -r .immutable <<<"$previous_json")" = true
          test "$(jq -r .tag_name <<<"$previous_json")" = "$PREVIOUS_TAG"
          previous_version="${PREVIOUS_TAG#v}"
          expected_previous=(
            SHA256SUMS
            install.sh
            "stn-v$previous_version-darwin-arm64.tar.gz"
            "stn-v$previous_version-darwin-x64.tar.gz"
            "stn-v$previous_version-linux-arm64.tar.gz"
            "stn-v$previous_version-linux-x64.tar.gz"
          )
          mapfile -t previous_assets < <(jq -r '.assets[].name' <<<"$previous_json" | sort)
          mapfile -t wanted_previous < <(printf '%s\n' "${expected_previous[@]}" | sort)
          test "${previous_assets[*]}" = "${wanted_previous[*]}"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r .draft <<<"$release_json")" = true
          test "$(jq -r .tag_name <<<"$release_json")" = "$TAG"
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$remote_commit" = "$COMMIT"

          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            printf 'Expected draft assets: %s\n' "${wanted[*]}" >&2
            printf 'Actual draft assets: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          current_ids="$(
            jq -r '.assets | sort_by(.name) | .[] | "\(.name)=\(.id)"' <<<"$release_json"
          )"
          test "$current_ids" = "$(cat candidate/asset-ids.txt)"

          mkdir downloaded
          for name in "${expected[@]}"; do
            asset_id="$(awk -F= -v name="$name" '$1 == name { print $2 }' candidate/asset-ids.txt)"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "downloaded/$name"
          done
          cmp candidate/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-release-candidate-${{ needs.validate.outputs.version }}-attempt-${{ github.run_attempt }}
          path: candidate
          if-no-files-found: error
          retention-days: 90
