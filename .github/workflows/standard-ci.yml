name: standard-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: standard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      installer: ${{ steps.paths.outputs.installer }}
      binary: ${{ steps.paths.outputs.binary }}
      claim_stress: ${{ steps.paths.outputs.claim_stress }}
      shell_matrix: ${{ steps.paths.outputs.shell_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify validation paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            {
              echo "docs_only=false"
              echo "installer=true"
              echo "binary=true"
              echo "claim_stress=true"
              echo "shell_matrix=true"
            } >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              node scripts/ci/classify-standard-ci.mjs >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - name: Documentation validation
        if: needs.classify.outputs.docs_only == 'true'
        run: |
          bun run lint
          bun run test:diagnostics:policy
      - name: Production static validation
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          bun run build
          bun run typecheck
          bun run lint

  fast_tests:
    name: fast-tests
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run test:ci:fast

  integration_tests:
    name: integration-tests
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run test:integration

  setup_e2e:
    name: setup-e2e (${{ matrix.lane }})
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: guided
            script: test:e2e:setup:guided
          - lane: core
            script: test:e2e:setup:core
          - lane: sqlite
            script: test:e2e:setup:sqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run build
      - name: Run setup E2E shard
        env:
          STATION_SETUP_E2E_ALL_SHELLS: ${{ needs.classify.outputs.shell_matrix }}
        run: bun run ${{ matrix.script }}

  observer_e2e:
    name: observer-e2e
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run build
      - run: bun run test:e2e:observer

  installer_smoke:
    name: installer-smoke
    needs: [classify, static]
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      needs.classify.outputs.installer == 'true' &&
      needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: bun run smoke:install

  sqlite_cross_runtime:
    name: sqlite-cross-runtime
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run build
      - name: Cross-runtime SQLite and claim checks
        env:
          CLAIM_STRESS: ${{ needs.classify.outputs.claim_stress }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag || "$CLAIM_STRESS" == true ]]; then
            bun run test:sqlite:bun
          else
            bun run test:sqlite:bun:pr
          fi

  station_tests:
    name: station-tests
    needs: [classify, static]
    if: needs.classify.outputs.docs_only != 'true' && needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          station-dependencies: "true"
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - run: bun run build
      - run: bun run test:ci:station

  binary_smoke:
    name: binary-smoke
    needs: [classify, static]
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      needs.classify.outputs.binary == 'true' &&
      needs.static.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          station-dependencies: "true"
          restore-turbo-cache: ${{ github.event_name == 'pull_request' }}
      - name: Run binary smoke
        id: binary_smoke_run
        env:
          STATION_BINARY_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/station-binary-smoke-evidence
        run: bun run test:ci:binary
      - name: Upload binary smoke failure evidence
        if: ${{ failure() && steps.binary_smoke_run.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/station-binary-smoke-evidence
          if-no-files-found: warn
          retention-days: 3
        continue-on-error: true

  standard-ci:
    name: standard-ci
    needs:
      - classify
      - static
      - fast_tests
      - integration_tests
      - setup_e2e
      - observer_e2e
      - installer_smoke
      - sqlite_cross_runtime
      - station_tests
      - binary_smoke
    if: >-
      always() &&
      (github.ref_type == 'tag' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected lane
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          INSTALLER_SELECTED: ${{ needs.classify.outputs.installer }}
          BINARY_SELECTED: ${{ needs.classify.outputs.binary }}
          CLAIM_STRESS_SELECTED: ${{ needs.classify.outputs.claim_stress }}
          SHELL_MATRIX_SELECTED: ${{ needs.classify.outputs.shell_matrix }}
          CLASSIFY: ${{ needs.classify.result }}
          STATIC: ${{ needs.static.result }}
          FAST_TESTS: ${{ needs.fast_tests.result }}
          INTEGRATION_TESTS: ${{ needs.integration_tests.result }}
          SETUP_E2E: ${{ needs.setup_e2e.result }}
          OBSERVER_E2E: ${{ needs.observer_e2e.result }}
          INSTALLER_SMOKE: ${{ needs.installer_smoke.result }}
          SQLITE_CROSS_RUNTIME: ${{ needs.sqlite_cross_runtime.result }}
          STATION_TESTS: ${{ needs.station_tests.result }}
          BINARY_SMOKE: ${{ needs.binary_smoke.result }}
        run: sh scripts/ci/require-standard-ci-results.sh

  main-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          restore-turbo-cache: "true"
      - name: Smoke
        run: |
          bun run build
          bun run typecheck
          bun run lint
