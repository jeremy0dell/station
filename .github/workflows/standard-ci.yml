name: standard-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: standard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standard-ci:
    # Reusable release calls retain the caller's tag context and must keep the full gate.
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify pull request paths
        id: changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.flatMap((file) =>
              file.previous_filename === undefined
                ? [file.filename]
                : [file.previous_filename, file.filename],
            );
            // Keep this trusted copy aligned with scripts/ci/change-scope.mjs;
            // PR-controlled code must not decide whether its own full gate runs.
            const isDocumentationPath = (path) =>
              path.startsWith("docs/") ||
              path.endsWith(".md") ||
              path.endsWith(".mdx");
            const documentationOnly =
              paths.length > 0 && paths.every(isDocumentationPath);
            const scope = documentationOnly ? "documentation-only" : "full";
            core.setOutput("scope", scope);
            core.info(`Change scope: ${scope} (${paths.length} paths inspected)`);
      - name: Accept documentation-only pull request
        if: steps.changes.outputs.scope == 'documentation-only'
        run: echo "Documentation-only pull request; skipping the full acceptance gate."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        with:
          node-version: 24.x
      - name: Enable pnpm 11
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      # Release acceptance stays cold so branch caches cannot enter candidate validation.
      - name: Restore Turbo cache
        if: github.event_name == 'pull_request' && steps.changes.outputs.scope != 'documentation-only'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        with:
          bun-version: 1.3.14
      - name: Install (pnpm)
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        run: pnpm install --frozen-lockfile
      - name: Install (bun)
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        run: bun install --frozen-lockfile
        working-directory: station
      - name: Test
        if: github.event_name != 'pull_request' || steps.changes.outputs.scope != 'documentation-only'
        run: pnpm test:pre-push

  main-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - name: Enable pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-pnpm11-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Smoke
        run: |
          pnpm build
          pnpm typecheck
          pnpm lint
